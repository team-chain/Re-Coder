# ─────────────────────────────────────────────────────────────────────
# 설계서 v6.4 §13 — Required GitHub Secrets
# ─────────────────────────────────────────────────────────────────────
# AWS/ECR/EC2 배포 확장을 사용한다면 다음 GitHub Secrets 를 등록하세요
# (Repository → Settings → Secrets and variables → Actions):
#
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - ECR_REGISTRY     (예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com)
#   - EC2_HOST         (배포 대상 EC2 공인 호스트 또는 도메인)
#   - EC2_SSH_KEY      (EC2 접속용 개인 키 전체 본문, BEGIN/END 포함)
#
# IAM 최소 권한 — ecr:* / ec2:DescribeInstances 만 허용한 Inline policy 권장.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Syntax check
        run: python -m compileall .
