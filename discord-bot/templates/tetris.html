<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { display:flex; align-items:center; justify-content:center; background:#0e0f14; font-family:"Segoe UI",sans-serif; }
  #wrap { display:flex; gap:18px; padding:18px; background:#15171f; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  canvas { background:#0a0b10; border-radius:8px; display:block; }
  #side { width:150px; color:#e8eaf0; display:flex; flex-direction:column; gap:14px; }
  .box { background:#1d2030; border-radius:8px; padding:12px; }
  .label { font-size:12px; color:#8b90a3; letter-spacing:1px; }
  .val { font-size:24px; font-weight:800; margin-top:2px; }
  #next { display:block; }
  #over { margin-top:auto; font-size:13px; color:#8b90a3; min-height:18px; }
  #over b { color:#ff6b6b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="side">
    <div class="box"><div class="label">NEXT</div><canvas id="next" width="120" height="120"></canvas></div>
    <div class="box"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div class="box"><div class="label">LEVEL</div><div class="val" id="level">1</div></div>
    <div class="box"><div class="label">LINES</div><div class="val" id="lines">0</div></div>
    <div id="over"></div>
  </div>
</div>
<script>
const COLS = 10, ROWS = 20, CELL = 30;
const bctx = document.getElementById('board').getContext('2d');
const nctx = document.getElementById('next').getContext('2d');
const elScore = document.getElementById('score');
const elLevel = document.getElementById('level');
const elLines = document.getElementById('lines');
const elOver  = document.getElementById('over');

const SHAPES = {
  I: { color:'#3ad1e0', cells:[[0,1],[1,1],[2,1],[3,1]], size:4 },
  O: { color:'#f2d23a', cells:[[0,0],[1,0],[0,1],[1,1]], size:2 },
  T: { color:'#b46bd6', cells:[[1,0],[0,1],[1,1],[2,1]], size:3 },
  S: { color:'#5ad65a', cells:[[1,0],[2,0],[0,1],[1,1]], size:3 },
  Z: { color:'#ff6b6b', cells:[[0,0],[1,0],[1,1],[2,1]], size:3 },
  J: { color:'#5a7bff', cells:[[0,0],[0,1],[1,1],[2,1]], size:3 },
  L: { color:'#ff9f43', cells:[[2,0],[0,1],[1,1],[2,1]], size:3 },
};
const KEYS = Object.keys(SHAPES);

let board, cur, next, bag = [];
let score, level, lines, gameOver;
let dropAcc = 0, last = 0;

function newBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }

function refillBag(){
  const k = KEYS.slice();
  for (let i=k.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [k[i],k[j]]=[k[j],k[i]]; }
  bag.push(...k);
}
function nextType(){ if (bag.length===0) refillBag(); return bag.shift(); }

function spawn(type){
  const s = SHAPES[type];
  const matrix = Array.from({length:s.size},()=>Array(s.size).fill(0));
  s.cells.forEach(([x,y])=>matrix[y][x]=1);
  return { type, color:s.color, matrix, x: Math.floor((COLS - s.size)/2), y: 0 };
}

function rotate(matrix){
  const n = matrix.length;
  const r = Array.from({length:n},()=>Array(n).fill(0));
  for (let y=0;y<n;y++) for (let x=0;x<n;x++) r[x][n-1-y] = matrix[y][x];
  return r;
}

function collides(piece, ox, oy, mat){
  const m = mat || piece.matrix;
  for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++){
    if (!m[y][x]) continue;
    const nx = piece.x + x + ox, ny = piece.y + y + oy;
    if (nx<0 || nx>=COLS || ny>=ROWS) return true;
    if (ny>=0 && board[ny][nx]) return true;
  }
  return false;
}

function merge(piece){
  piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{
    if (v){ const ny=piece.y+y; if (ny>=0) board[ny][piece.x+x]=piece.color; }
  }));
}

function clearLines(){
  let cleared = 0;
  for (let y=ROWS-1;y>=0;y--){
    if (board[y].every(c=>c)){ board.splice(y,1); board.unshift(Array(COLS).fill(null)); cleared++; y++; }
  }
  if (cleared){
    score += [0,100,300,500,800][cleared] * level;
    lines += cleared;
    level = Math.floor(lines/10) + 1;
    elScore.textContent = score; elLines.textContent = lines; elLevel.textContent = level;
  }
}

function lockAndNext(){
  merge(cur);
  clearLines();
  cur = next; next = spawn(nextType());
  drawNext();
  if (collides(cur,0,0)){ gameOver = true; elOver.innerHTML = '<b>GAME OVER</b> — R로 재시작'; }
}

function dropInterval(){ return Math.max(80, 800 - (level-1)*70); }

function hardDrop(){ while(!collides(cur,0,1)) cur.y++; lockAndNext(); dropAcc=0; }

function ghostY(){ let gy=cur.y; while(!collides(cur,0, gy-cur.y+1)) gy++; return gy; }

function drawCell(ctx,x,y,color,size){
  ctx.fillStyle = color;
  ctx.fillRect(x*size, y*size, size, size);
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x*size+1, y*size+1, size-2, size-2);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(x*size+3, y*size+3, size-6, 4);
}

function draw(){
  bctx.clearRect(0,0,COLS*CELL,ROWS*CELL);
  bctx.strokeStyle='rgba(255,255,255,.04)';
  for (let x=1;x<COLS;x++){ bctx.beginPath(); bctx.moveTo(x*CELL,0); bctx.lineTo(x*CELL,ROWS*CELL); bctx.stroke(); }
  for (let y=1;y<ROWS;y++){ bctx.beginPath(); bctx.moveTo(0,y*CELL); bctx.lineTo(COLS*CELL,y*CELL); bctx.stroke(); }
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (board[y][x]) drawCell(bctx,x,y,board[y][x],CELL);
  if (!cur) return;
  const gy = ghostY();
  cur.matrix.forEach((row,y)=>row.forEach((v,x)=>{ if(v && gy+y>=0){
    bctx.fillStyle='rgba(255,255,255,.10)'; bctx.fillRect((cur.x+x)*CELL,(gy+y)*CELL,CELL,CELL);
  }}));
  cur.matrix.forEach((row,y)=>row.forEach((v,x)=>{ if(v && cur.y+y>=0) drawCell(bctx,cur.x+x,cur.y+y,cur.color,CELL); }));
}

function drawNext(){
  nctx.clearRect(0,0,120,120);
  const s = SHAPES[next.type], size=24, off=(120 - s.size*size)/2;
  next.matrix.forEach((row,y)=>row.forEach((v,x)=>{ if(v){
    nctx.save(); nctx.translate(off,off); drawCell(nctx,x,y,next.color,size); nctx.restore();
  }}));
}

function reset(){
  board = newBoard(); bag=[]; score=0; level=1; lines=0; gameOver=false; dropAcc=0;
  elScore.textContent=0; elLevel.textContent=1; elLines.textContent=0; elOver.textContent='';
  cur = spawn(nextType()); next = spawn(nextType()); drawNext();
}

document.addEventListener('keydown', e=>{
  if (gameOver){ if (e.key==='r'||e.key==='R'){ reset(); } return; }
  if (e.key==='ArrowLeft'){ if(!collides(cur,-1,0)) cur.x--; }
  else if (e.key==='ArrowRight'){ if(!collides(cur,1,0)) cur.x++; }
  else if (e.key==='ArrowDown'){ if(!collides(cur,0,1)){ cur.y++; dropAcc=0; } }
  else if (e.key==='ArrowUp'){
    const r = rotate(cur.matrix);
    for (const k of [0,-1,1,-2,2]){ if(!collides(cur,k,0,r)){ cur.matrix=r; cur.x+=k; break; } }
  }
  else if (e.key===' '){ e.preventDefault(); hardDrop(); }
  draw();
});

function loop(now){
  if (!last) last = now;
  const dt = now - last; last = now;
  if (!gameOver){
    dropAcc += dt;
    let guard = 0;
    while (dropAcc >= dropInterval() && guard++ < 4){
      dropAcc -= dropInterval();
      if (!collides(cur,0,1)) cur.y++; else { lockAndNext(); break; }
    }
    draw();
  }
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
