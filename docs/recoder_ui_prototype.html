<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCoder Workspace — UI 프로토타입</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0d0d0d; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; color: #e0e0e0; font-size: 12px; }
  .app { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, .85fr); height: 100vh; background: #1e1e1e; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } .chat { display: none; } }

  /* ── 왼쪽 ── */
  .main { display: flex; flex-direction: column; border-right: 1px solid #333; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #2a2a2a; background: #181818; }
  .topbar strong { font-size: 15px; } .topbar .ws { color: #8b8b8b; font-size: 12px; }
  .topbar .st { margin-left: auto; display: flex; align-items: center; gap: 6px; color: #3fb950; font-size: 11.5px; }
  .topbar .st .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }
  .topbar .home { border: 1px solid transparent; border-radius: 4px; padding: 4px 9px; background: #3a3d41; color: #fff; font-size: 11px; cursor: pointer; }
  .body { flex: 1; padding: 20px 22px; min-height: 0; overflow-y: auto; }
  .foot { padding: 10px 22px; border-top: 1px solid #2a2a2a; display: flex; gap: 14px; align-items: center; color: #8a8a8a; font-size: 11px; }
  .foot .ok::before { content: "● "; color: #3fb950; } .foot .no::before { content: "● "; color: #6b6b6b; }
  .foot .r { margin-left: auto; }

  button { font-family: inherit; }
  .btn { border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; font-size: 11.5px; font-weight: 600; background: #0e639c; color: #fff; cursor: pointer; }
  .btn.ghost { background: transparent; border-color: #3a3f47; color: #d0d6dc; }
  .btn:disabled { opacity: .5; cursor: default; }
  .mono { font-family: "SF Mono", Menlo, monospace; font-size: 11px; }

  /* ── 홈: 허브 카드 ── */
  .hubs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .hub { text-align: left; border: 1px solid #2e3238; border-radius: 14px; padding: 20px 18px 16px; background: #232629; color: #e0e0e0; display: flex; flex-direction: column; min-height: 250px; cursor: pointer; }
  .hub:hover { border-color: #4a5560; }
  .hub .ic { font-size: 26px; margin-bottom: 12px; }
  .hub h3 { margin: 0 0 4px; font-size: 19px; }
  .hub .sub { color: #8f98a3; font-size: 12px; margin-bottom: 14px; }
  .hub ul { list-style: none; margin: 0; padding: 0; font-size: 12.5px; flex: 1; }
  .hub li { padding: 6px 0; border-top: 1px solid #2c3036; } .hub li:first-child { border-top: none; }
  .hub .ft { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .hub .ft .go { color: #4a9eff; font-weight: 600; }
  .hub.dev { border-top: 3px solid #4a9eff; } .hub.dep { border-top: 3px solid #f0b35b; } .hub.sec { border-top: 3px solid #ef6b6b; }
  .pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid #2f6b4a; color: #7ed3a2; }
  .pill.warn { border-color: #6b4a17; color: #f0b35b; }

  /* ── 브레드크럼 ── */
  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .crumb a { color: #4a9eff; cursor: pointer; font-size: 12.5px; }
  .crumb .sep { color: #8f98a3; }
  .crumb .ttl { display: flex; align-items: center; gap: 9px; }
  .crumb .ttl .ic { font-size: 20px; }
  .crumb .ttl b { font-size: 18px; } .crumb .ttl .s { color: #8f98a3; font-size: 11.5px; }
  .crumb .cur { font-size: 15px; font-weight: 700; }
  .crumb .sw { margin-left: auto; display: flex; gap: 6px; }
  .crumb .sw button { padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid #2e3238; background: transparent; color: #9aa3ad; }
  .crumb .sw button.on { background: #1c2b3d; color: #fff; border-color: #3f7fb5; }

  /* ── 기능 카드 ── */
  .feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .fcard { border: 1px solid #2e3238; border-radius: 12px; background: #202326; padding: 18px; display: flex; flex-direction: column; min-height: 150px; }
  .fcard .t { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
  .fcard .d { color: #8f98a3; font-size: 12px; line-height: 1.5; margin-top: 8px; flex: 1; }
  .fcard .a { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
  .fcard .a .m { margin-left: auto; color: #6b7480; font-size: 11px; }

  /* ── 기능 화면 공통 ── */
  .panel { border: 1px solid #2e3238; border-radius: 12px; background: #202326; padding: 16px 18px; }
  .lbl { font-size: 11.5px; color: #8f98a3; margin-bottom: 6px; }
  .ta { width: 100%; border: 1px solid #3a3f47; border-radius: 8px; background: #1a1d20; padding: 10px 12px; color: #d0d6dc; font-size: 12px; min-height: 64px; font-family: inherit; resize: vertical; }
  .toolrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .chip { padding: 3px 9px; border-radius: 999px; border: 1px solid #3a3f47; color: #cfd6dc; font-size: 11px; cursor: pointer; background: transparent; }
  .turn { border: 1px solid #2e3238; border-radius: 10px; background: #1b1e21; padding: 12px 14px; margin-top: 14px; }
  .turn .q { color: #9aa3ad; font-size: 11.5px; margin-bottom: 8px; }
  .frow { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid #2c3036; font-size: 12px; }
  .frow .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid #2f6b4a; color: #7ed3a2; text-align: center; }
  .frow .ops { display: flex; gap: 6px; }
  .frow .ops span { padding: 3px 8px; border-radius: 5px; border: 1px solid #3a3f47; font-size: 11px; }
  .frow .ops span.ok { color: #7ed3a2; border-color: #2f6b4a; }
  .risk { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: #1f3328; color: #7ed3a2; }
  .diff { font-family: "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.55; background: #141618; border: 1px solid #2c3036; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .diff .m { color: #ff8b8b; } .diff .p { color: #7ed3a2; } .diff .c { color: #6b7480; }
  .adr { display: grid; grid-template-columns: minmax(200px, 240px) 1fr; gap: 14px; }
  .adrl { border: 1px solid #2e3238; border-radius: 10px; background: #202326; overflow: hidden; align-self: start; }
  .adrl div { padding: 10px 12px; border-top: 1px solid #2c3036; font-size: 12px; cursor: pointer; } .adrl div:first-child { border-top: none; }
  .adrl div.on { background: #1c2b3d; } .adrl .id { color: #8fa4b5; font-family: Menlo, monospace; font-size: 10.5px; }
  .adrd h4 { margin: 0 0 6px; font-size: 15px; } .adrd .meta { color: #8f98a3; font-size: 11px; margin-bottom: 12px; }
  .adrd h5 { margin: 12px 0 4px; font-size: 12px; color: #9aa3ad; } .adrd p { margin: 0; font-size: 12px; line-height: 1.55; }
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #2c3036; }
  .srow:first-of-type { border-top: none; }
  .srow .v { font-size: 11.5px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #8f98a3; font-weight: 500; padding: 6px 0; }
  td { padding: 8px 8px 8px 0; border-top: 1px solid #2c3036; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: #9aa3ad; margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .banner { border: 1px solid #6b4a17; background: #2a2417; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; }
  .banner .s { color: #f0c98a; font-size: 11.5px; margin-top: 3px; }

  /* ── 오른쪽 채팅 (모든 화면 동일) ── */
  .chat { display: flex; flex-direction: column; background: #1e1e1e; min-width: 0; }
  .chat .hd { padding: 14px 16px 12px; border-bottom: 1px solid #2a2a2a; }
  .chat .hd strong { font-size: 15px; }
  .chat .msgs { flex: 1; padding: 12px 14px; background: linear-gradient(180deg, rgba(80,131,158,.10), transparent 230px); overflow-y: auto; }
  .b { max-width: 88%; padding: 8px 11px; border-radius: 3px 13px 13px 13px; background: #2d3037; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
  .b.me { margin-left: auto; background: #3188ae; color: #fff; border-radius: 13px 3px 13px 13px; }
  .card { border: 1px solid #3f7fb5; border-radius: 9px; background: #1b2530; font-size: 11.5px; margin: 4px 0 10px; max-width: 92%; overflow: hidden; }
  .card .ch { padding: 8px 11px; background: #22303d; border-bottom: 1px solid #2f4658; font-weight: 700; color: #e6f0f8; display: flex; gap: 8px; align-items: center; }
  .card .ch .badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #3a2a10; color: #f0b35b; border: 1px solid #6b4a17; }
  .card .cb { padding: 9px 11px; color: #dfe6ec; }
  .card .cb code { font-family: Menlo, monospace; font-size: 11px; background: #0f161d; padding: 1px 5px; border-radius: 4px; color: #cfe3f2; }
  .card .ca { display: flex; gap: 8px; padding: 9px 11px; border-top: 1px solid #2f4658; background: #1a232c; }
  .card.done { border-color: #2f6b4a; } .card.done .ch { background: #1f3328; border-color: #2f6b4a; }
  .card .step { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .card .step i { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-style: normal; font-weight: 800; background: #2f6b4a; color: #c9f5da; }
  .chat .in { border-top: 1px solid #2a2a2a; padding: 10px 12px 12px; }
  .chat .in .row { display: flex; gap: 7px; align-items: flex-end; }
  .chat .in textarea { flex: 1; border: 1px solid #3f3f3f; border-radius: 9px; background: #3c3c3c; padding: 9px; color: #fff; font-family: inherit; font-size: 12px; resize: none; height: 46px; }
  .chat .in .f { margin-top: 6px; color: #777; font-size: 10px; }


  /* ── 모달 · 토스트 ── */
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 50; padding: 18px; }
  .mdl { width: min(560px, 100%); max-height: calc(100vh - 36px); overflow-y: auto; border: 1px solid #454545; border-radius: 10px; background: #252526; box-shadow: 0 18px 48px rgba(0,0,0,.45); }
  .mdl .mh { padding: 14px 18px 10px; border-bottom: 1px solid #3b3b3b; display: flex; align-items: center; gap: 10px; }
  .mdl .mh b { font-size: 14px; } .mdl .mh .x { margin-left: auto; color: #999; cursor: pointer; background: none; border: none; font-size: 16px; }
  .mdl .mb { padding: 14px 18px; font-size: 12px; line-height: 1.55; }
  .mdl .mf { padding: 10px 18px 14px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #3b3b3b; }
  .opt { border: 1px solid #3a3f47; border-radius: 9px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
  .opt.on { border-color: #3f7fb5; background: #1c2b3d; }
  .opt .ot { font-weight: 700; display: flex; gap: 8px; align-items: center; } .opt .rec { font-size: 10px; color: #7ed3a2; border: 1px solid #2f6b4a; border-radius: 4px; padding: 0 5px; }
  .opt .od { color: #9aa3ad; margin-top: 3px; } .opt .pc { margin-top: 5px; font-size: 11px; color: #8f98a3; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2d3037; border: 1px solid #454545; color: #e0e0e0; padding: 9px 14px; border-radius: 8px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 60; }
  .dd { position: absolute; top: 34px; left: 0; width: 300px; border: 1px solid #3a3f47; border-radius: 8px; background: #252526; box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; z-index: 5; }
  .dd div { padding: 8px 12px; border-top: 1px solid #2c3036; cursor: pointer; } .dd div:first-child { border-top: none; } .dd div:hover { background: #1c2b3d; }
  .dd .m2 { font-family: Menlo, monospace; font-size: 11px; color: #8fa4b5; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid #4a9eff; border-top-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; margin-right: 5px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .fade { animation: fd .25s ease-out; } @keyframes fd { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .gal { position: fixed; inset: 0; background: #0d0d0d; overflow-y: auto; z-index: 40; padding: 24px; }
  .gal .gh { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .gal .gh b { font-size: 16px; } .gal .gh .s { color: #8f98a3; }
  .gal .gh button { margin-left: auto; }
  .gal .gf { border: 1px solid #333; border-radius: 10px; background: #1e1e1e; margin-bottom: 8px; overflow: hidden; }
  .gal .gf .gt { padding: 8px 14px; background: #181818; border-bottom: 1px solid #2a2a2a; font-size: 12px; display: flex; gap: 10px; align-items: center; }
  .gal .gf .gt b { font-size: 13px; } .gal .gf .gt .s { color: #8f98a3; }
  .gal .gf .gb { padding: 18px 20px; pointer-events: none; }
  .gal .gc { color: #8f98a3; font-size: 11.5px; margin: 0 0 22px 4px; }
  .hidden { display: none !important; }
</style></head>
<body>
<div class="app">
  <div class="main">
    <div class="topbar"><strong>ReCoder</strong><span class="ws">Workspace</span><span class="st"><span class="dot"></span>준비됨</span><button class="home" onclick="go('home')">홈</button><button class="home" style="background:transparent;border-color:#3a3f47;color:#9aa3ad" onclick="toggleGallery()" id="galBtn">모든 화면 보기</button></div>
    <div class="body" id="body"></div>
    <div class="foot"><span class="ok">GitHub</span><span class="ok">AWS · ap-northeast-2</span><span class="no">Discord</span><span class="r">Haiku 4.5 · 사용량 0.3%</span></div>
  </div>

  <div class="chat">
    <div class="hd"><strong>AI와 대화</strong></div>
    <div class="msgs" id="msgs">
      <div class="b">안녕하세요, ReCoder예요. 궁금한 것을 물어보거나, 만들거나 고칠 것을 말해 주세요.</div>
    </div>
    <div class="in">
      <div class="row"><textarea id="chatIn" placeholder="메시지를 입력하세요 (예: ~/Desktop/te2 폴더 만들고 테트리스 사이트 만들어줘)"></textarea><button class="btn" onclick="sendChat()">전송</button></div>
      <div class="f">Enter로 전송 · Shift + Enter로 줄바꿈 · 파일 변경은 승인 카드에서 승인한 뒤에만 진행됩니다</div>
    </div>
  </div>
</div>

<script>
const HUBS = {
  develop: { icon: "⌨️", title: "Develop", sub: "요청부터 코드 적용까지", cls: "dev", pill: "AI 준비됨", feats: ["code","build","map","adr"] },
  deploy:  { icon: "🚀", title: "Deploy",  sub: "로컬 Docker부터 AWS까지", cls: "dep", pill: "Docker 준비됨", feats: ["ship","center","replay","operate"] },
  security:{ icon: "🛡️", title: "Security", sub: "배포 전 검사와 정책", cls: "sec", pill: "검사 · 정책", feats: ["scan","secrets","policy"] },
};
const FEATS = {
  code:    { hub:"develop", icon:"✨", title:"코드 생성 · 수정", desc:"자연어로 새 코드를 만들거나 기존 코드를 고칩니다. 설계 결정 카드 → 파일별 diff → 적용 순서로 진행돼요.", action:"시작", primary:true, meta:"최근 · 테트리스 4파일" },
  build:   { hub:"develop", icon:"🩺", title:"에러 분석", desc:"터미널·로그의 오류를 읽고 원인과 패치를 제안합니다. 승인 전에는 파일을 건드리지 않아요.", action:"분석", primary:true, meta:"마지막 분석 없음" },
  map:     { hub:"develop", icon:"🗺️", title:"아키텍처", desc:"파일 간 의존 관계와 함수 호출 관계를 그림으로 봅니다. 코드를 실제로 읽어 만든 결과예요.", action:"보기", meta:"파일 42 · 고립 2" },
  adr:     { hub:"develop", icon:"📝", title:"설계 기록 (ADR)", desc:"결정 카드에서 확정한 내용이 자동으로 쌓입니다. 어떤 선택을 왜 했는지 나중에 찾아볼 수 있어요.", action:"열기", meta:"3건" },
  ship:    { hub:"deploy", icon:"🐳", title:"로컬 Docker 배포", desc:"Dockerfile 생성 → 검사 → build → run → 헬스체크. 실패하면 이전 이미지로 되돌립니다.", action:"시작", primary:true, meta:"recoder-app:v2 · 실행 중" },
  center:  { hub:"deploy", icon:"☁️", title:"배포 센터", desc:"ECS · EC2 · S3 정적 사이트. 외부로 나가는 배포는 검사 결과에 따라 승인 강도가 달라져요.", action:"열기", primary:true, meta:"S3 · 어제 배포" },
  replay:  { hub:"deploy", icon:"↩️", title:"롤백 · Replay", desc:"배포 이력을 타임라인으로 보고 원하는 시점으로 되돌립니다.", action:"이력 보기", meta:"7건" },
  operate: { hub:"deploy", icon:"📟", title:"운영 대응", desc:"장애 감지 → 원인 분석 → 조치 제안. 실행은 승인 후에만.", action:"열기", meta:"감시 중 · 이상 없음" },
  scan:    { hub:"security", icon:"🔍", title:"취약점 스캔", desc:"Trivy(이미지·의존성) · Hadolint(Dockerfile). 결과는 배포 승인 카드의 위험도에 반영됩니다.", action:"스캔", primary:true, meta:"미실행" },
  secrets: { hub:"security", icon:"🔑", title:"시크릿 검사", desc:"gitleaks 규칙으로 저장소에 평문 비밀값이 남았는지 확인합니다. 원문은 표시하지 않아요.", action:"검사", primary:true, meta:"0건 · 09-14" },
  policy:  { hub:"security", icon:"📜", title:"정책 게이트", desc:"어떤 배포가 자동 통과 · 승인 필요 · 차단인지 규칙(OPA)으로 봅니다.", action:"규칙 보기", meta:"12개" },
};

const el = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function crumb(hub, feat) {
  const h = HUBS[hub];
  const sw = Object.keys(HUBS).map((k) => `<button class="${k===hub?'on':''}" onclick="go('hub:${k}')">${HUBS[k].title}</button>`).join("");
  const mid = feat
    ? `<a onclick="go('hub:${hub}')">${h.title}</a><span class="sep">/</span><span class="cur">${FEATS[feat].title}</span>`
    : `<span class="ttl"><span class="ic">${h.icon}</span><span><b>${h.title}</b><div class="s">${h.sub}</div></span></span>`;
  return `<div class="crumb"><a onclick="go('home')">‹ 홈</a><span class="sep">/</span>${mid}<div class="sw">${sw}</div></div>`;
}

function renderHome() {

    addMsg(`<div class="b">바닐라 HTML/CSS/JS로 만들게요. 아래에서 위치와 파일을 확인하고 승인해 주세요.</div>`);
    addMsg(`<div class="card" id="card${id}"><div class="ch">📁 생성 승인${folder ? '<span class="badge">프로젝트 밖 · 새 폴더</span>' : ''}</div>
      <div class="cb">위치 &nbsp;<code>${esc(folder || "프로젝트 루트")}</code><br><div style="margin-top:6px">파일 &nbsp;<span class="mono">index.html · style.css · script.js</span></div>${folder ? '<div style="margin-top:8px;padding:6px 8px;border-radius:6px;background:rgba(240,179,91,.08);border:1px solid rgba(240,179,91,.35);color:#f0c98a;font-size:11px">현재 열린 프로젝트 밖이에요. 승인하면 폴더를 만들고 워크스페이스에 추가한 뒤 그 안에만 파일을 씁니다.</div>' : ''}</div>
      <div class="ca"><button class="btn" onclick="approve(${id}, '${esc(folder || "프로젝트 루트")}')">승인하고 생성</button><button class="btn ghost" onclick="toast('폴더 선택 창이 열려요 (프로토타입에서는 생략)')">위치 변경</button><button class="btn ghost" style="margin-left:auto;border:none" onclick="document.getElementById('card${id}').remove()">취소</button></div></div>`);
  }, 500);
}
function approve(id, folder) {
  const c = document.getElementById("card" + id); if (!c) return;
  c.className = "card done";
  c.innerHTML = `<div class="ch">✅ 승인됨 · 진행 중<span class="badge" style="background:#1f3328;color:#8fd9ad;border-color:#2f6b4a">${folder}</span></div><div class="cb" id="steps${id}"><div class="step"><i>✓</i>폴더 생성 · 워크스페이스에 추가</div></div>`;
  go("code");
  const steps = [["설계 결정 — 결정할 항목 없음 (건너뜀)",700],["index.html · 42줄",1400],["style.css",2000],["script.js",2600]];
  steps.forEach(([s,t]) => setTimeout(() => { const d=document.createElement("div"); d.className="step"; d.innerHTML=`<i>✓</i>${s}`; document.getElementById("steps"+id).appendChild(d); el("#msgs").scrollTop=1e9; }, t));
  setTimeout(() => { const d=document.createElement("div"); d.className="ca"; d.innerHTML=`<button class="btn" onclick="this.parentNode.innerHTML='<span style=color:#8fd9ad;font-size:11.5px>✓ 3개 파일이 ${folder}에 저장됐어요.</span>'">모두 적용 (3개 파일 저장)</button><span style="color:#8a95a0;font-size:10.5px;align-self:center">파일별 diff·개별 적용은 왼쪽 코드 작성 패널</span>`; c.appendChild(d); el("#msgs").scrollTop=1e9; }, 3200);
}
el("#chatIn").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });

go(location.hash ? location.hash.slice(1) : "home");
</script>
