name: CI

# 개별 브랜치 → develop PR 시 검증 (회차1 회고 합의사항)
# main 브랜치는 건드리지 않는다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: pytest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: 의존성 설치
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 테스트 의존성을 워크플로에 직접 적지 않는다. 여기 적어두면
          # 로컬 개발 환경에는 그 사실이 안 보여서, moto 가 없는 컴퓨터에서
          # aws_infra 테스트와 런타임 권한 대조가 조용히 스킵된다.
          pip install -r requirements-dev.txt

      - name: 테스트 실행
        working-directory: core
        env:
          PYTHONPATH: .
        # 낡은 테스트 4건(FR 회차2 「낡은 테스트 4건 수리」, PR #14)은 수리 완료로
        # 격리를 해제했다. 이제 전체 스위트가 게이팅에 그대로 들어간다.
        run: |
          pytest tests/ -q

  # ── 웹뷰 렌더 테스트 ───────────────────────────────────────────────────
  # 왜 필요한가: Workspace 창에서 결정 카드가 뜨지 않던 버그(showCodeAgent
  # =false)는 파이썬 테스트로는 절대 못 잡는다. UI 가 조용히 사라져도 CI 가
  # 초록이었기 때문에 데모 당일까지 아무도 몰랐다. 웹뷰를 Node 에서 실제로
  # 렌더해서 핵심 경로가 화면에 붙어 있는지 확인한다.
  webview:
    name: webview 렌더 테스트 (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: 의존성 설치
        working-directory: extension
        run: npm ci

      - name: 웹뷰 렌더 테스트
        working-directory: extension
        run: npm run test:webview

  # ── Watchdog 감시 로직 ─────────────────────────────────────────────────
  # 왜 필요한가: 이상 판정은 **틀려도 예외가 안 난다.** 너무 민감하면 멀쩡한
  # 배포마다 롤백을 권해 사람이 경고를 무시하게 되고, 너무 둔감하면 죽은 앱을
  # 정상이라고 말한다. 둘 다 조용히 일어나므로 검사를 게이팅에 넣는다.
  watchdog:
    name: pytest (watchdog)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # ECS 검사는 moto 로 실제 서비스를 만들어 돌린다. 응답 모양을
          # 상상해서 쓰면 그 상상이 틀렸을 때 테스트만 통과한다.
          pip install -r core/requirements-dev.txt

      - name: 테스트 실행
        working-directory: watchdog
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q
