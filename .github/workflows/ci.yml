name: CI

# 개별 브랜치 → develop PR 시 검증 (회차1 회고 합의사항)
# main 브랜치는 건드리지 않는다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: pytest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: 의존성 설치
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 테스트 의존성을 워크플로에 직접 적지 않는다. 여기 적어두면
          # 로컬 개발 환경에는 그 사실이 안 보여서, moto 가 없는 컴퓨터에서
          # aws_infra 테스트와 런타임 권한 대조가 조용히 스킵된다.
          pip install -r requirements-dev.txt

      - name: 테스트 실행
        working-directory: core
        env:
          PYTHONPATH: .
        # 낡은 테스트 4건(FR 회차2 「낡은 테스트 4건 수리」, PR #14)은 수리 완료로
        # 격리를 해제했다. 이제 전체 스위트가 게이팅에 그대로 들어간다.
        run: |
          pytest tests/ -q
