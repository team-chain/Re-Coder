name: CI

# develop PR 및 codex/feat/** 작업 브랜치의 각 푸시를 검증한다.
# main 브랜치는 건드리지 않는다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, 'codex/feat/**']
  workflow_dispatch:
  # 2.0.33 릴리스(태그) 빌드도 같은 테스트를 통과해야 올린다 — release.yml 이 이 워크플로를 불러 쓴다.
  workflow_call:

jobs:
  repair-security-eval:
    name: Promptfoo 수정안 보안 회귀
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evals/repair-security/package-lock.json
      - name: 평가 의존성 설치
        run: |
          python -m pip install -r core/requirements.txt
          npm ci --ignore-scripts --omit=optional --prefix evals/repair-security
          npm run setup:native --prefix evals/repair-security
          npm audit --omit=optional --audit-level=moderate --prefix evals/repair-security
      - name: 공격 응답·정상 수정 대조군 평가
        env:
          PROMPTFOO_PYTHON: python
          AWS_EC2_METADATA_DISABLED: 'true'
        run: npm test --prefix evals/repair-security
      - name: 평가 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-security-eval
          path: evals/repair-security/results/security.json
          if-no-files-found: warn

  test:
    # 2.0.30 — 사용자 PC 는 대부분 Windows 다. 리눅스에서만 초록이면 Windows 에서만 깨지는 것(경로·인코딩·셸)을
    # 사용자가 먼저 만난다. 세 OS 와 두 Python 버전(설치본 3.11 · 최신 3.13)에서 같은 스위트를 돌린다.
    name: pytest (core · ${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.13'

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Python ${{ matrix.python }} 준비
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: 의존성 설치
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 테스트 의존성을 워크플로에 직접 적지 않는다. 여기 적어두면
          # 로컬 개발 환경에는 그 사실이 안 보여서, moto 가 없는 컴퓨터에서
          # aws_infra 테스트와 런타임 권한 대조가 조용히 스킵된다.
          pip install -r requirements-dev.txt

      - name: 테스트 실행
        working-directory: core
        env:
          PYTHONPATH: .
          # 실제 AWS 자격증명이 있는 러너에서도 테스트가 진짜 계정을 부르지 않게(moto 만).
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        # 낡은 테스트 4건(FR 회차2 「낡은 테스트 4건 수리」, PR #14)은 수리 완료로
        # 격리를 해제했다. 이제 전체 스위트가 게이팅에 그대로 들어간다.
        run: |
          pytest tests/ -q

  # ── 골든패스 스모크 ────────────────────────────────────────────────────
  # 왜 필요한가: 단위 테스트는 조각별 동작만 본다. plan 이 준 결정 카드 모양을
  # generate 가 더 이상 받아들이지 않는 식으로 **조각 사이의 배선**이 끊기면,
  # core/tests 는 전부 초록인데 제품의 핵심 흐름은 죽어 있다. 회차1 데모 당일까지
  # 아무도 몰랐던 버그가 그 종류였다. 생성 → 배포를 한 번 끝까지 통과시켜 본다.
  #
  # LLM 은 픽스처, S3 는 moto 라 비용이 들지 않는다. 실제 모델·실제 버킷까지
  # 보는 --live 는 CI 에 넣지 않는다 — PR 마다 Bedrock 토큰을 태우게 되고,
  # 자격증명을 CI 시크릿에 넣어야 한다. 그건 하루 1회 수동 실행으로 남긴다.
  golden-path:
    name: 골든패스 스모크 (생성 → 배포)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt
          # moto 가 없으면 스모크는 스킵이 아니라 실패한다(스크립트 참고).
          pip install -r core/requirements-dev.txt

      - name: 골든패스 실행
        run: python scripts/golden_path_smoke.py

      - name: 문서 근거 수정 Docker 스모크
        run: python scripts/smoke_grounded_repair.py

  # ── 웹뷰 렌더 테스트 ───────────────────────────────────────────────────
  # 왜 필요한가: Workspace 창에서 결정 카드가 뜨지 않던 버그(showCodeAgent
  # =false)는 파이썬 테스트로는 절대 못 잡는다. UI 가 조용히 사라져도 CI 가
  # 초록이었기 때문에 데모 당일까지 아무도 몰랐다. 웹뷰를 Node 에서 실제로
  # 렌더해서 핵심 경로가 화면에 붙어 있는지 확인한다.
  webview:
    name: webview 렌더 테스트 (extension · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Node 22 준비
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: 의존성 설치
        working-directory: extension
        run: npm ci

      - name: 웹뷰 렌더 테스트
        working-directory: extension
        run: npm test

      - name: 프로덕션 빌드와 VSIX 구성 검사
        working-directory: extension
        run: |
          npm run build
          npm run verify:package

  # ── Watchdog 감시 로직 ─────────────────────────────────────────────────
  # 왜 필요한가: 이상 판정은 **틀려도 예외가 안 난다.** 너무 민감하면 멀쩡한
  # 배포마다 롤백을 권해 사람이 경고를 무시하게 되고, 너무 둔감하면 죽은 앱을
  # 정상이라고 말한다. 둘 다 조용히 일어나므로 검사를 게이팅에 넣는다.
  watchdog:
    name: pytest (watchdog)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # ECS 검사는 moto 로 실제 서비스를 만들어 돌린다. 응답 모양을
          # 상상해서 쓰면 그 상상이 틀렸을 때 테스트만 통과한다.
          pip install -r core/requirements-dev.txt

      - name: 테스트 실행
        working-directory: watchdog
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q

  discord:
    name: Discord 로그인·프로젝트 연결
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            discord-bot/requirements.txt
            discord-bot/requirements-dev.txt
      - name: 의존성 설치
        run: python -m pip install -r discord-bot/requirements-dev.txt
      - name: Discord API 대역 및 실제 HTTP/WebSocket 검증
        working-directory: discord-bot
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest tests/ -q

  commerce:
    name: 쇼핑몰 주문·보안 통합 검증
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: 새 DB와 모의 결제 서버에서 실행
        run: docker compose -f benchmarks/commerce/compose.yml -p recoder-commerce-check up --build -d --wait
      - name: 가격·권한·재고 경쟁·웹훅 재시도 검증
        env:
          SHOP_ALLOW_DISPOSABLE_TESTS: '1'
        run: python benchmarks/commerce/acceptance.py
      - name: 검증 자원 정리
        if: always()
        run: docker compose -f benchmarks/commerce/compose.yml -p recoder-commerce-check down -v

  dependency-audit:
    name: 배포 의존성 보안 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: npm 잠금 파일 검사 (개발 의존성 포함)
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix extension --audit-level=moderate
          npm audit --prefix core/starter_templates/commerce/backend --audit-level=moderate
          npm audit --prefix core/starter_templates/commerce/frontend --audit-level=moderate
      - name: 플랫폼별 Python 배포 잠금 파일 검사
        run: |
          python -m pip install --upgrade 'pip>=26.2' pip-audit
          for lock in core/requirements-release-*.txt; do
            python -m pip_audit --no-deps --disable-pip -r "$lock"
          done
