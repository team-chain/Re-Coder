name: CI

# 개별 브랜치 → develop PR 시 검증 (회차1 회고 합의사항)
# main 브랜치는 건드리지 않는다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: pytest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: 의존성 설치
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 테스트 의존성을 워크플로에 직접 적지 않는다. 여기 적어두면
          # 로컬 개발 환경에는 그 사실이 안 보여서, moto 가 없는 컴퓨터에서
          # aws_infra 테스트와 런타임 권한 대조가 조용히 스킵된다.
          pip install -r requirements-dev.txt

      - name: 테스트 실행
        working-directory: core
        env:
          PYTHONPATH: .
        # NOTE: 아래 4건은 코드 변경을 못 따라간 '낡은 테스트'로, 회차1 이전부터 실패 중.
        #       CI 도입을 막지 않도록 임시 격리한다. 별도 태스크로 수리 후 이 줄을 제거할 것.
        run: |
          pytest tests/ -q \
            --deselect tests/test_analyze_flow.py::test_analyze_request_dataclass_round_trip \
            --deselect tests/test_command_registry.py::test_approval_levels_partition \
            --deselect tests/test_infra_generate.py::test_generate_dockerfile_returns_proposal \
            --deselect tests/test_infra_generate.py::test_generate_docker_compose

      - name: 격리된 낡은 테스트 (실패해도 CI 통과 — 현황 가시화용)
        working-directory: core
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_analyze_flow.py::test_analyze_request_dataclass_round_trip \
            tests/test_command_registry.py::test_approval_levels_partition \
            tests/test_infra_generate.py::test_generate_dockerfile_returns_proposal \
            tests/test_infra_generate.py::test_generate_docker_compose
