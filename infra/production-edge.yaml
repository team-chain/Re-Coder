AWSTemplateFormatVersion: '2010-09-09'
Description: ReCoder HTTPS entry point. Private ALB, CloudFront VPC origin, no API caching.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  AppSecurityGroup: {Type: 'AWS::EC2::SecurityGroup::Id'}
  AvailabilityZoneA: {Type: 'AWS::EC2::AvailabilityZone::Name'}
  AvailabilityZoneB: {Type: 'AWS::EC2::AvailabilityZone::Name'}
  PrivateCidrA: {Type: String, AllowedPattern: '[0-9./]+'}
  PrivateCidrB: {Type: String, AllowedPattern: '[0-9./]+'}
  CloudFrontPrefixList: {Type: String, AllowedPattern: 'pl-[a-f0-9]+'}
  AppPort: {Type: Number, Default: 8000, MinValue: 1, MaxValue: 65535}
  HealthPath: {Type: String, Default: /health}
Resources:
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VpcId, CidrBlock: !Ref PrivateCidrA, AvailabilityZone: !Ref AvailabilityZoneA, MapPublicIpOnLaunch: false}
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VpcId, CidrBlock: !Ref PrivateCidrB, AvailabilityZone: !Ref AvailabilityZoneB, MapPublicIpOnLaunch: false}
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VpcId}
  AssociateA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRoutes}
  AssociateB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRoutes}
  AlbGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: !Ref AppPort, ToPort: !Ref AppPort, DestinationSecurityGroupId: !Ref AppSecurityGroup}
  AppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AppSecurityGroup, IpProtocol: tcp, FromPort: !Ref AppPort, ToPort: !Ref AppPort, SourceSecurityGroupId: !Ref AlbGroup}
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: [AssociateA, AssociateB]
    Properties:
      Scheme: internal
      Type: application
      Subnets: [!Ref PrivateA, !Ref PrivateB]
      SecurityGroups: [!Ref AlbGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: ip
      HealthCheckPath: !Ref HealthPath
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '15'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Target}]
  Origin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: Listener
    Properties:
      VpcOriginEndpointConfig:
        Name: !Ref AWS::StackName
        Arn: !Ref Alb
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]
  Headers:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Ref AWS::StackName
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Preload: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ReCoder private application HTTPS entry point
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: app
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig: {VpcOriginId: !GetAtt Origin.Id, OriginReadTimeout: 30, OriginKeepaliveTimeout: 5}
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
          ForwardedValues:
            QueryString: true
            Cookies: {Forward: all}
            Headers: ['*']
          ResponseHeadersPolicyId: !Ref Headers
Outputs:
  Domain: {Value: !GetAtt Distribution.DomainName}
  DistributionId: {Value: !Ref Distribution}
  TargetGroupArn: {Value: !Ref Target}
  AlbArn: {Value: !Ref Alb}
  OriginId: {Value: !GetAtt Origin.Id}
