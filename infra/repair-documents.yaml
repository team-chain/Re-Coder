AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Optional customer-account official documentation refresh (no model calls)
Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  Refresh:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../core/grounded_repair/
      Handler: grounded_repair.refresh_lambda.handler
      Runtime: python3.12
      Timeout: 600
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENT_BUCKET: !Ref DocumentBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DocumentBucket.Arn}/sources/manifest.json'
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${DocumentBucket.Arn}/index/corpus.json'
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${DocumentBucket.Arn}/index/licenses/*'
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Enabled: false
    Metadata:
      BuildMethod: makefile
Outputs:
  BucketName:
    Value: !Ref DocumentBucket
