services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: retest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/retest
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_me_in_production_1234567890}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: gemini-embedding-001
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
        VITE_WS_URL: ws://127.0.0.1:8000
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  pgdata:
